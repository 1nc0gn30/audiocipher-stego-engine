[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocipher-stego-engine"
version = "0.1.0"
description = "Audio-Keyed Cryptography, PCM Audio Steganography & Morse Spectrogram Synthesizer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "1nc0gn30" }
]
keywords = [
    "audio-steganography",
    "cryptography",
    "stego",
    "lsb",
    "morse",
    "wav",
    "spectrogram",
    "acoustic-modem",
    "bfsk",
    "fsk-stego",
    "ultrasonic-data",
    "audio-modem",
    "mcp",
    "fastmcp",
    "material-3",
    "zero-dependencies"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Sound/Audio"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
audiocipher = "audiocipher_stego_engine.cli:main"
audio-stego = "audiocipher_stego_engine.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/audiocipher-stego-engine"
Repository = "https://github.com/1nc0gn30/audiocipher-stego-engine"
Issues = "https://github.com/1nc0gn30/audiocipher-stego-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
